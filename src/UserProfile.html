<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", sans-serif;
}

body{
  background:#ececec;
}

.app{
  width:1300px;
  height:720px;
  background:#f7f7f7;
  margin:30px auto;
  border-radius:20px;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#fff;
  padding:30px 20px;
}

.logo{
  font-size:22px;
  font-weight:700;
  color:orange;
  margin-bottom:50px;
}

.sidebar ul{
  list-style:none;
}

.sidebar li{
  padding:12px 20px;
  margin-bottom:15px;
  border-radius:30px;
  cursor:pointer;
}

.sidebar li.active{
  background:orange;
  color:#fff;
}

.sidebar li:hover{
  background:#ffd1a6;
}

/* MAIN AREA */
.main{
  flex:1;
  padding:40px 50px;
  position:relative;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:60px;
  height:60px;
  background:#f59ad9;
  border-radius:50%;
}

.btn{
  padding:8px 25px;
  border-radius:30px;
  border:none;
  cursor:pointer;
  font-size:14px;
}

.edit{
  background:#ff7a00;
  color:#fff;
}

.save{
  background:#ff7a00;
  color:#fff;
  margin-left:10px;
}

/* FORM */
.form{
  margin-top:40px;
  width:500px;
}

.field{
  margin-bottom:25px;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-size:15px;
}

.field input{
  width:100%;
  padding:12px 18px;
  border-radius:30px;
  border:none;
  background:#e1e1e1;
  outline:none;
}

/* ORDER SECTION */
.orders{
  position:absolute;
  right:50px;
  bottom:60px;
  display:flex;
  gap:30px;
}

/* CURRENT ORDER */
.card{
  width:260px;
  background:#fff;
  border-radius:25px;
  padding:25px;
  text-align:center;
}

.card h3{
  margin-bottom:40px;
  font-weight:500;
}

.card p{
  margin-top:40px;
  font-size:15px;
}

/* REORDER */
.reorder{
  width:320px;
  background:#fff;
  border-radius:25px;
  padding:20px;
}

.reorder-top{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:15px;
}

.reorder-top button{
  padding:8px 18px;
  border:none;
  border-radius:30px;
  background:#ff7a00;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

.items{
  display:flex;
  justify-content:space-between;
}

.item{
  text-align:center;
}

.item img{
  width:120px;
  height:120px;
  border-radius:15px;
  object-fit:cover;
}

.item p{
  margin-top:8px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">▲▲▲</div>
  <ul>
    <li>Dashboard</li>
    <li>Menu</li>
    <li>Orders</li>
    <li class="active">User</li>
    <li>Logout</li>
  </ul>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <h2>Welcome John S</h2>
    <div class="profile">
      <span>Profile</span>
      <div class="avatar"></div>
      <button class="btn edit">Edit</button>
      <button class="btn save">Save</button>
    </div>
  </div>

  <!-- FORM -->
  <div class="form">
    <div class="field">
      <label>First Name</label>
      <input type="text" value="John">
    </div>

    <div class="field">
      <label>Last Name</label>
      <input type="text" value="S">
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email">
    </div>
  </div>

  <!-- ORDER SECTION -->
  <div class="orders">

    <div class="card">
      <h3>Your Current Order</h3>
      <h4>Chicken Burger</h4>
      <p>Status : Preparing</p>
    </div>

    <div class="reorder">
      <div class="reorder-top">
        <button>Reorder Food</button>
        <button>Add Orders</button>
      </div>

      <div class="items">
        <div class="item">
          <img src="https://images.unsplash.com/photo-1546069901-eacef0df6022">
          <p>Chicken Thukpa</p>
        </div>

        <div class="item">
          <img src="https://images.unsplash.com/photo-1548365328-9f547f29b024">
          <p>Mixed Pizza</p>
        </div>
      </div>
    </div>

  </div>
</div>
</div>

</body>
</html>
