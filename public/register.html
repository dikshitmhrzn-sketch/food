<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .register-box {
            width: 350px;
            background: #f49ad0;
            padding: 40px;
            border-radius: 40px;
            margin: 40px auto;
            text-align: center;
        }

        .register-box h2 {
            color: white;
            font-size: 26px;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 16px;
            color: white;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .btn {
            display: block;
            width: 60%;
            padding: 12px;
            background: #737373;
            color: white;
            border: none;
            border-radius: 30px;
            margin: 10px auto 20px auto;
            cursor: pointer;
            font-size: 17px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .login-text {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            color: #3b3b3b;
        }

        .login-text a {
            color: blue;
            text-decoration: none;
            margin-left: 3px;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>Register</h2>

    <form action="#">
        <label>Name:</label>
        <input type="text" placeholder="">

        <label>Address:</label>
        <input type="text" placeholder="">

        <label>Phone no:</label>
        <input type="text" placeholder="">

        <label>Password:</label>
        <input type="password" placeholder="">

        <label>Email:</label>
        <input type="email" placeholder="">

        <button class="btn">Register</button>

        <p class="login-text">
            Already Have an Account?
            <a href="#">Login</a>
        </p>
    </form>
</div>

</body>
</html>
